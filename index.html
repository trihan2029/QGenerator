<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Paper Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- HEADER (UNCHANGED STRUCTURE) -->
    <div id="header-section">
        <div class="header-top">
            <input type="file" id="logoUpload">
            <h1 contenteditable="true" class="school-name">SCHOOL NAME</h1>
        </div>

        <h3 contenteditable="true">Sub Heading</h3>
        <h2 contenteditable="true">Exam Title</h2>

        <div class="details">
            <div>
                <div contenteditable="true">Subject: </div>
                <div contenteditable="true">Class: </div>
            </div>

            <div class="vertical-divider"></div>

            <div>
                <div contenteditable="true">Student Name: </div>
                <div contenteditable="true">Roll No: </div>
            </div>

            <div class="vertical-divider"></div>

            <div>
                <div contenteditable="true">Time: </div>
                <div contenteditable="true">Total Marks: <span id="headerTotalMarks">0</span></div>
            </div>
        </div>

        <hr class="thick-divider">
    </div>

    <!-- SECTION CONTROLS -->
    <div class="controls no-print">
        <button id="addSectionBtn">Add Section</button>
    </div>

    <!-- SECTIONS CONTAINER -->
    <div id="sectionsContainer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
