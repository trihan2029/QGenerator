<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Question Paper Generator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- ================= FORM ================= -->
<div class="form-section">

<h3>Enter Details</h3>

<label>School Name</label>
<input type="text" oninput="updateText('school-name', this.value)">

<label>Exam Title</label>
<input type="text" oninput="updateText('exam-title', this.value)">

<label>Total Marks</label>
<input type="number" oninput="updateText('totalMarks', this.value)">

<hr>

<button onclick="addSection()">Add Section</button>
<button onclick="printPaper()">Print</button>

</div>


<!-- ================= PREVIEW ================= -->
<div class="paper-wrapper">

<div id="paper" class="paper-container">

<!-- HEADER -->
<div class="header">
<h1 id="school-name"></h1>
<div id="exam-title"></div>
<div class="marks-line">
Total Marks: <span id="totalMarks"></span>
</div>
</div>

<div class="section-divider"></div>

<div id="questions-container"></div>

</div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
