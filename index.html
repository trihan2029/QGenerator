<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Question Paper Generator</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="container">

<!-- FORM -->
<div class="form-section">

<h3>Enter Details</h3>

<input type="text" placeholder="School Name"
oninput="updateText('school-name', this.value)">

<input type="text" placeholder="Exam Title"
oninput="updateText('exam-title', this.value)">

<input type="number" placeholder="Total Marks"
oninput="updateText('totalMarks', this.value)">

<hr>

<button onclick="addSection()">Add Section</button>
<button onclick="printPaper()">Print</button>

</div>

<!-- PREVIEW -->
<div class="paper-wrapper">
<div id="paper" class="paper-container">

<div class="header">
<h1 id="school-name"></h1>
<div id="exam-title"></div>
<div>Total Marks: <span id="totalMarks"></span></div>
</div>

<div class="section-divider"></div>

<div id="questions-container"></div>

</div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
